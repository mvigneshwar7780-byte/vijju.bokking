[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
markers =
    concurrency: spawns real threads against real connections; slower
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:passlib.*
    # langchain-community announces its own sunset on import. Treating that as
    # an error fails every test that touches the assistant, for a message no
    # change in this repo can silence.
    ignore::DeprecationWarning:langchain_community.*
    ignore:.*langchain-community.*:DeprecationWarning
