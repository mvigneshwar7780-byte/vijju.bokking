# Ruff configuration for the backend.
#
# Rule selection is left at ruff's defaults (E4, E7, E9, F) -- the set this
# codebase was written and kept clean against. This file exists only to draw one
# line: application code is linted, personal experiment scripts are not.

exclude = [
    # Run by hand, never imported by the app, and deliberately written in a
    # top-to-bottom notebook style -- imports after code, prints, module-level
    # side effects. Linting them as application modules produces noise their
    # author has no reason to act on.
    "app/db/seed/vector_db.py",
    "app/db/seed/ingest_help.py",
    "app/db/seed/test.py",
]

[lint.per-file-ignores]
# This router carries a block of superseded scaffolding above its imports while
# the retrieval engine is being built, which reads to E402 as "imports not at
# top of file". Scoped to this one file so the rule keeps working everywhere
# else; remove this line once that block is deleted.
"app/modules/assistant/router.py" = ["E402"]
