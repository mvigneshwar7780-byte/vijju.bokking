<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#F26B21"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#E8362A"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <polygon points="0,1 10,5 0,9" fill="#7A8794"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- ─────────── title ─────────── -->
  <text x="50" y="58" font-size="34" font-weight="700" fill="#15181D">How the help assistant answers a question</text>
  <text x="50" y="90" font-size="17" fill="#6B7280">Retrieval-augmented generation · vijju.booking · FastAPI + LanceDB</text>

  <!-- ─────────── return path (drawn first, sits behind) ─────────── -->
  <path d="M 1435 212 L 1435 140 L 105 140 L 105 206" fill="none" stroke="#E8362A"
        stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arR)"/>
  <text x="770" y="131" font-size="15" fill="#E8362A" text-anchor="middle" font-weight="600">answer rendered in the chat bubble</text>

  <!-- ─────────── 1 · user ─────────── -->
  <circle cx="105" cy="234" r="17" fill="#15181D"/>
  <path d="M 72 292 a 33 30 0 0 1 66 0 z" fill="#15181D"/>
  <text x="105" y="322" font-size="18" font-weight="700" fill="#15181D" text-anchor="middle">User</text>
  <text x="105" y="343" font-size="13" fill="#6B7280" text-anchor="middle">chat widget</text>

  <line x1="160" y1="252" x2="222" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>
  <text x="191" y="240" font-size="14" fill="#15181D" text-anchor="middle" font-weight="600">question</text>

  <!-- ─────────── 2 · semantic search container ─────────── -->
  <rect x="230" y="168" width="380" height="184" rx="10" fill="#FAFAFA" stroke="#B9B9B9" stroke-width="1.5"/>
  <text x="420" y="194" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1.6" text-anchor="middle">SEMANTIC SEARCH</text>

  <rect x="250" y="212" width="160" height="80" rx="8" fill="#E8F1FB" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="330" y="245" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Embed</text>
  <text x="330" y="266" font-size="12" fill="#4B5563" text-anchor="middle">the question</text>
  <text x="330" y="283" font-size="11" fill="#6B7280" text-anchor="middle" font-style="italic">MiniLM-L6-v2</text>

  <line x1="412" y1="252" x2="426" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="430" y="212" width="160" height="80" rx="8" fill="#E3F3F3" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="510" y="245" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Nearest</text>
  <text x="510" y="266" font-size="12" fill="#4B5563" text-anchor="middle">neighbour search</text>
  <text x="510" y="283" font-size="11" fill="#6B7280" text-anchor="middle" font-style="italic">top k = 3</text>


  <!-- ─────────── vector store, below ─────────── -->
  <path d="M 370 352 L 370 424" fill="none" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M 470 424 L 470 352" fill="none" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>
  <text x="352" y="394" font-size="13" fill="#15181D" text-anchor="end" font-weight="600">384-d query vector</text>
  <text x="488" y="394" font-size="13" fill="#15181D" text-anchor="start" font-weight="600">3 nearest chunks</text>

  <ellipse cx="420" cy="446" rx="118" ry="20" fill="#F0E9FB" stroke="#2B2B2B" stroke-width="1.6"/>
  <path d="M 302 446 L 302 528 a 118 20 0 0 0 236 0 L 538 446" fill="#F0E9FB" stroke="#2B2B2B" stroke-width="1.6"/>
  <path d="M 302 487 a 118 20 0 0 0 236 0" fill="none" stroke="#2B2B2B" stroke-width="1.1" opacity="0.45"/>
  <text x="420" y="480" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Vector DB</text>
  <text x="420" y="514" font-size="12" fill="#4B5563" text-anchor="middle">23 chunks + embeddings</text>
  <text x="560" y="470" font-size="13" fill="#15181D" font-weight="700">LanceDB</text>
  <text x="560" y="492" font-size="12" fill="#6B7280">backend/lancedb_help/</text>
  <text x="560" y="512" font-size="12" fill="#6B7280">a folder on disk, not Postgres</text>

  <!-- ─────────── ingest pipeline (offline) ─────────── -->
  <rect x="230" y="630" width="610" height="190" rx="10" fill="#FAFAFA" stroke="#B9B9B9" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="535" y="658" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="1.6" text-anchor="middle">BUILT ONCE · OFFLINE</text>

  <rect x="250" y="680" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="335" y="712" font-size="15" font-weight="700" fill="#15181D" text-anchor="middle">Help corpus</text>
  <text x="335" y="733" font-size="11.5" fill="#4B5563" text-anchor="middle">policies · formats</text>
  <text x="335" y="749" font-size="11.5" fill="#4B5563" text-anchor="middle">refunds · FAQs</text>

  <line x1="422" y1="720" x2="438" y2="720" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="442" y="680" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="527" y="712" font-size="15" font-weight="700" fill="#15181D" text-anchor="middle">Chunk</text>
  <text x="527" y="733" font-size="11.5" fill="#4B5563" text-anchor="middle">split on headings</text>
  <text x="527" y="749" font-size="11.5" fill="#4B5563" text-anchor="middle">one topic each</text>

  <line x1="614" y1="720" x2="630" y2="720" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="634" y="680" width="170" height="80" rx="8" fill="#E8F1FB" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="719" y="712" font-size="15" font-weight="700" fill="#15181D" text-anchor="middle">Embed</text>
  <text x="719" y="733" font-size="11.5" fill="#4B5563" text-anchor="middle">same model</text>
  <text x="719" y="749" font-size="11.5" fill="#4B5563" text-anchor="middle">as the question</text>

  <path d="M 420 630 L 420 554" fill="none" stroke="#7A8794" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arG)"/>

  <!-- ─────────── 3 · context ─────────── -->
  <line x1="612" y1="252" x2="672" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <rect x="680" y="212" width="150" height="80" rx="8" fill="#E6F5EC" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="755" y="245" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Context</text>
  <text x="755" y="267" font-size="12" fill="#4B5563" text-anchor="middle">the passages</text>
  <text x="755" y="283" font-size="12" fill="#4B5563" text-anchor="middle">that matched</text>

  <line x1="832" y1="252" x2="892" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ─────────── 4 · prompt ─────────── -->
  <rect x="900" y="212" width="180" height="80" rx="8" fill="#FDF0DC" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="990" y="243" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Prompt</text>
  <text x="990" y="266" font-size="12.5" fill="#4B5563" text-anchor="middle">question + context</text>
  <text x="990" y="283" font-size="11" fill="#6B7280" text-anchor="middle" font-style="italic">grounding, not training</text>

  <line x1="1082" y1="252" x2="1142" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ─────────── 5 · llm ─────────── -->
  <rect x="1150" y="212" width="140" height="80" rx="8" fill="#F0E9FB" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="1220" y="248" font-size="17" font-weight="700" fill="#15181D" text-anchor="middle">LLM</text>
  <text x="1220" y="272" font-size="12" fill="#4B5563" text-anchor="middle">writes the reply</text>

  <line x1="1292" y1="252" x2="1352" y2="252" stroke="#F26B21" stroke-width="3" marker-end="url(#ar)"/>

  <!-- ─────────── 6 · answer ─────────── -->
  <rect x="1360" y="212" width="150" height="80" rx="8" fill="#E6F5EC" stroke="#2B2B2B" stroke-width="1.6"/>
  <text x="1435" y="245" font-size="16" font-weight="700" fill="#15181D" text-anchor="middle">Answer</text>
  <text x="1435" y="267" font-size="12" fill="#4B5563" text-anchor="middle">with the sources</text>
  <text x="1435" y="283" font-size="12" fill="#4B5563" text-anchor="middle">it came from</text>

  <!-- ─────────── footer note ─────────── -->
  <text x="890" y="700" font-size="16" font-weight="700" fill="#15181D">Why retrieval, not fine-tuning</text>
  <text x="890" y="728" font-size="13.5" fill="#4B5563">The model is never trained on the policies. They are</text>
  <text x="890" y="749" font-size="13.5" fill="#4B5563">fetched at question time and pasted into the prompt —</text>
  <text x="890" y="770" font-size="13.5" fill="#4B5563">so editing a refund rule takes one re-ingest, not a retrain.</text>
  <line x1="874" y1="678" x2="874" y2="786" stroke="#F26B21" stroke-width="3"/>
</svg>
